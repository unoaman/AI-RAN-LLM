# OpenAirInterface gNB / CU: E2 agent section for FlexRIC (docs/RAN_INTEGRATION.md §9.3).
# From OAI openair2/E2AP/README.md. OAI must be built with --build-e2 and the SAME
# E2AP_VERSION / KPM_VERSION as FlexRIC, and FlexRIC's service models installed in sm_dir.
# Combine with the neighbour list and periodic measurement configuration in
# integrations/oai/measurement.example.conf: RC "message copy" only forwards the
# MeasurementReports the UE actually sends.

e2_agent = {
  near_ric_ip_addr = "127.0.0.1";          # host running FlexRIC's nearRT-RIC
  sm_dir = "/usr/local/lib/flexric/";      # FlexRIC `sudo make install` default
}
