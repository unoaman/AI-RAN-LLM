# OpenAirInterface gNB/CU: measurement configuration for the HandoverLLM xApp.
# Key names follow OAI's doc/handover-tutorial.md; check them for your OAI version.
# Periodic reports give the model a regular RSRP history of serving + neighbour cells.

neighbour_list = (
  {
    nr_cellid = 12345678;
    neighbour_cell_configuration = (
      {
        gNB_ID = 0xe01;
        nr_cellid = 11111111;
        physical_cellId = 1;
        absoluteFrequencySSB = 641280;
        subcarrierSpacing = 1;   # 30 kHz
        band = 78;
        plmn = { mcc = 001; mnc = 01; mnc_length = 2 };
        tracking_area_code = 1;
      }
    )
  }
);

nr_measurement_configuration = {
  Periodical = {
    enable                     = 1;
    includeBeamMeasurements    = 1;
    maxNrofRS_IndexesToReport  = 4;
  };
  # A3 events still work as a fallback trigger in OAI; keep the offset high so OAI
  # does not pre-empt the xApp's decisions.
  A3 = ({ physCellId = -1; offset = 10; hysteresis = 0; time_to_trigger = 1 })
};

# UE ids for the telnet commands (cu-ue-id / RRC UE id) are listed in nrRRC_stats.log,
# which the CU writes periodically to its working directory.
#
# Run the CU/gNB with the telnet server for the oai-telnet actuator:
#   ./nr-softmodem ... --telnetsrv --telnetsrv.shrmod ci --telnetsrv.listenaddr 127.0.0.1
# (build with: ./build_oai --gNB --build-lib telnetsrv ; add --build-e2 for FlexRIC / E2)
